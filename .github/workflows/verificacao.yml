name: Verificação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: pnpm (pnpm/action-setup v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Node (actions/setup-node v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Recusar .only em testes
        run: |
          if grep -rnE '\b(it|test|describe)(\.each\([^)]*\))?\.only\b' apps packages tests \
            --include='*.ts' --include='*.tsx' --exclude-dir=node_modules --exclude-dir=dist; then
            echo '::error::Remova .only dos testes.'
            exit 1
          fi

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verificar o bundle do web
        run: |
          if grep -rnE '/Users/|/home/runner|node:fs|node:path|ELEICOES_|sqcand' apps/web/dist; then
            echo '::error::O bundle do web contém caminho local, módulo de Node ou nome interno.'
            exit 1
          fi
          grep -q 'Origem dos resultados não configurada' apps/web/dist/assets/*.js
